<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samira Fashion - Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
<div class="max-w-3xl mx-auto">
<h1 class="text-2xl font-bold">Samira Fashion - Admin Panel</h1>
<p class="text-sm text-gray-600 mt-1">Order gulo WhatsApp e jabe. Ekhane sudhu product manage korben.</p>

<div class="bg-white p-4 rounded-2xl mt-6">
<h2 class="font-bold">New Product Add</h2>
<input id="pName" placeholder="Product Name (ex: Black Borka)" class="border w-full mt-3 p-2 rounded">
<input id="pPrice" placeholder="Price (ex: 1850)" type="number" class="border w-full mt-2 p-2 rounded">
<select id="pCat" class="border w-full mt-2 p-2 rounded">
<option value="borka">Borka</option>
<option value="three-piece">Three-Piece</option>
<option value="jama">Jama</option>
</select>
<input id="pImg" placeholder="Chobir Link (na dileo hobe)" class="border w-full mt-2 p-2 rounded">
<button onclick="addProduct()" class="bg-black text-white w-full py-2.5 rounded-full mt-3">Add Product</button>
</div>

<div id="list" class="mt-6 grid gap-3"></div>

<script>
let products = JSON.parse(localStorage.getItem('samira_products')) || [
{name:"Black Premium Borka", price:1850, cat:"borka"},
{name:"Cotton Three-Piece", price:1450, cat:"three-piece"},
]

function render(){
let h="";
products.forEach((p,i)=>{
h+=`<div class="bg-white p-3 rounded-xl flex justify-between"><div><b>${p.name}</b><br><small>৳ ${p.price} - ${p.cat}</small></div><button onclick="del(${i})" class="text-red-600 text-sm">Delete</button></div>`
})
document.getElementById('list').innerHTML=h;
}
window.addProduct=()=>{
let name=document.getElementById('pName').value;
let price=document.getElementById('pPrice').value;
let cat=document.getElementById('pCat').value;
if(!name || !price){alert("Name Price din"); return;}
products.push({name, price, cat});
localStorage.setItem('samira_products', JSON.stringify(products));
render();
alert("Product Add Hoise! Ekhon index.html e auto show korbe na, manually index.html er code eo add korte hobe.");
}
window.del=(i)=>{
products.splice(i,1);
localStorage.setItem('samira_products', JSON.stringify(products));
render();
}
render();
</script>
</div>
</body>
</html>
